name: Check lesson links

# 레슨의 외부 링크(더 읽을거리 등)를 매주 검사하고, 깨진 링크가 있으면 이슈를 연다.
# 내부(.mdx 상대) 링크는 npm run build 가 이미 검사하므로 http(s)만 본다.
on:
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        # --exclude: 다이어그램 속 예시 주소(portal.example.com 등)는 실제 사이트가 아니다
        with:
          args: >-
            --no-progress
            --scheme https --scheme http
            --exclude-path build
            --accept '100..=103,200..=299,429'
            --max-retries 3
            --exclude '//[^/]*example\.'
            'docs/**/*.mdx' 'i18n/**/*.mdx'
          fail: false
      - if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links in lessons
          content-filepath: ./lychee/out.md
          labels: bug
